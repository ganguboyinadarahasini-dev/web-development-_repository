<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop Comparison Guide</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
            color: #222;
        }

        header {
            background-color: #1e3a5f;
            color: white;
            text-align: center;
            padding: 25px;
        }

        main {
            width: 90%;
            max-width: 1200px;
            margin: 25px auto;
        }

        section {
            background: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 10px;
        }

        h2 {
            color: #1e3a5f;
        }

        ul, ol, dl {
            line-height: 1.8;
        }

        .products {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .product {
            flex: 1;
            min-width: 220px;
            text-align: center;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
        }

        .product img {
            width: 200px;
            height: 130px;
            object-fit: contain;
        }

        .product a {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background-color: #1e3a5f;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        caption {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        th, td {
            border: 1px solid #bbb;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #1e3a5f;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f1f5f9;
        }

        blockquote {
            background-color: #eef5ff;
            border-left: 5px solid #1e3a5f;
            padding: 15px;
            font-style: italic;
        }

        pre {
            background-color: #222;
            color: #eee;
            padding: 15px;
            overflow-x: auto;
            border-radius: 5px;
        }

        mark {
            padding: 3px;
        }
    </style>
</head>

<body>

<header>
    <h1>Laptop Comparison Guide</h1>
    <p>Find the right laptop for studying, programming, creativity and everyday use.</p>
</header>

<main>

    <!--
